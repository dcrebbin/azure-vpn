port: 7890

socks-port: 7891

allow-lan: true

mode: rule

log-level: debug

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  nameserver:
    - 1.1.1.1
    - 8.8.8.8
  fallback:
    - tls://dns.rubyfish.cn:853
    - tls://1.0.0.1:853
    - tls://dns.google:853

proxies:
  - name: "clash"
    type: ss
    # your IP or host
    server: example.com
    port: 443
    cipher: aes-256-gcm
    # Your password from your Shadowsock config file
    password: "password"
    plugin: v2ray-plugin
    plugin-opts:
      mode: websocket
      tls: true
      # your IP or host (example.com)
      host: example.com
      skip-cert-verify: true

proxy-groups:
  - name: "auto"
    type: select
    proxies:
      - clash

rules:
  - MATCH,auto
